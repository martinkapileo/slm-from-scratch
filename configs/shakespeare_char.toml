# Baseline: ~0.8M-param char-level GPT. Trains on a laptop CPU in ~10-15 min.

[model]
block_size = 128
n_layer = 4
n_head = 4
n_embd = 128
dropout = 0.1

[train]
data_dir = "data/shakespeare_char"
out_dir = "runs/shakespeare_char"
batch_size = 32
max_iters = 3000
eval_interval = 250
eval_iters = 50
learning_rate = 1e-3
min_lr = 1e-4
warmup_iters = 100
weight_decay = 0.1
grad_clip = 1.0
seed = 1337
device = "auto"
