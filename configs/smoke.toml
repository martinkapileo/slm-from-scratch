# Tiny config for CI and quick sanity checks. Not for real training.

[model]
block_size = 32
n_layer = 2
n_head = 2
n_embd = 32
dropout = 0.0

[train]
data_dir = "data/shakespeare_char"
out_dir = "runs/smoke"
batch_size = 8
max_iters = 50
eval_interval = 25
eval_iters = 5
learning_rate = 3e-3
warmup_iters = 5
device = "cpu"
